name: Deploy public retirement life planner

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test public app
        run: npm run test:public

      - name: Test beta app
        run: npm run test:beta

      - name: Build public app
        run: GITHUB_PAGES=true npm run build:public

      - name: Build beta app
        run: GITHUB_PAGES=true npm run build:beta

      - name: Assemble Pages site
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/life-asset-beta
          cp -R apps/retirement-life-planner-public/dist/. pages-dist/
          cp -R apps/life-asset-simulator-beta/dist/. pages-dist/life-asset-beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
